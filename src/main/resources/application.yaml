spring:
  application:
    name: poomitda

  jpa:
    open-in-view: false

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

server:
  tomcat:
    max-swallow-size: 8MB

jwt:
  issuer: poomitda
  secret: ${JWT_SECRET}
  access-token-expiration: 30m
  refresh-token-expiration: 14d

aws:
  s3:
    region: ${AWS_REGION:ap-northeast-2}
    bucket: ${AWS_S3_BUCKET:poomitda-dev-images}